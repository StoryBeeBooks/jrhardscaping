<!DOCTYPE html>
<html lang="zh-Hans">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="预约免费硬景咨询服务，服务多伦多及大多伦多地区。车道、露台、挡土墙及户外生活空间专业报价。立即联系 JR Hardscaping。">
    <title>联系我们 - JR Hardscaping | 预约免费咨询</title>
    <link rel="alternate" hreflang="en" href="https://jrhardscaping.com/contact" />
    <link rel="alternate" hreflang="zh-Hans" href="https://jrhardscaping.com/zh/contact-zh" />
    <link rel="stylesheet" href="../styles.css">
    
    <!-- LocalBusiness Schema -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "LocalBusiness",
      "name": "JR Hardscaping",
      "description": "多伦多及大多伦多地区专业硬景观施工服务。连锁砖车道、挡土墙、户外厨房、火坑、露台施工。",
      "url": "https://jrhardscaping.com/zh/contact-zh",
      "telephone": "+1-647-770-4953",
      "email": ["Frankie.Li@JrPartners.ca", "info@JrPartners.ca"],
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Toronto",
        "addressRegion": "ON",
        "addressCountry": "CA"
      },
      "geo": {
        "@type": "GeoCoordinates",
        "latitude": "43.6532",
        "longitude": "-79.3832"
      },
      "openingHoursSpecification": [
        {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"],
          "opens": "08:00",
          "closes": "18:00"
        },
        {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": "Saturday",
          "opens": "09:00",
          "closes": "16:00"
        }
      ],
      "priceRange": "$$$$",
      "areaServed": {
        "@type": "GeoCircle",
        "geoMidpoint": {
          "@type": "GeoCoordinates",
          "latitude": "43.6532",
          "longitude": "-79.3832"
        },
        "geoRadius": "50000"
      },
      "sameAs": [
        "https://www.instagram.com/jrhardscaping"
      ]
    }
    </script>

    <!-- Breadcrumb Schema -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "BreadcrumbList",
      "itemListElement": [
        {
          "@type": "ListItem",
          "position": 1,
          "name": "首页",
          "item": "https://jrhardscaping.com/zh/index-zh"
        },
        {
          "@type": "ListItem",
          "position": 2,
          "name": "联系我们",
          "item": "https://jrhardscaping.com/zh/contact-zh"
        }
      ]
    }
    </script>

    <style>
        .contact-wrapper {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--spacing-xl);
            margin-top: var(--spacing-xl);
        }

        .contact-form-section,
        .contact-info-section {
            background-color: var(--off-white);
            padding: var(--spacing-xl);
            border-radius: 8px;
        }

        .form-group {
            margin-bottom: var(--spacing-md);
        }

        .form-group label {
            display: block;
            margin-bottom: var(--spacing-xs);
            font-weight: 500;
            color: var(--dark-gray);
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: var(--spacing-sm);
            border: 1px solid var(--light-gray);
            border-radius: 4px;
            font-family: var(--font-primary);
            font-size: 1rem;
            transition: var(--transition-fast);
            background-color: var(--primary-white);
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(26, 115, 232, 0.1);
        }

        .form-group textarea {
            min-height: 150px;
            resize: vertical;
        }

        .submit-btn {
            background-color: var(--accent-blue);
            color: var(--primary-white);
            padding: var(--spacing-sm) var(--spacing-lg);
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition-smooth);
            width: 100%;
        }

        .submit-btn:hover {
            background-color: var(--accent-blue-dark);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px var(--shadow-medium);
        }

        .contact-info-item {
            margin-bottom: var(--spacing-md);
            padding-bottom: var(--spacing-md);
            border-bottom: 1px solid var(--light-gray);
        }

        .contact-info-item:last-child {
            border-bottom: none;
        }

        .contact-info-item h3 {
            font-size: 1.1rem;
            margin-bottom: var(--spacing-xs);
            color: var(--charcoal);
        }

        .contact-info-item p,
        .contact-info-item a {
            color: var(--accent-stone);
            line-height: 1.6;
        }

        .contact-info-item a:hover {
            color: var(--accent-blue);
        }

        @media (max-width: 768px) {
            .contact-wrapper {
                grid-template-columns: 1fr;
            }

            .contact-form-section,
            .contact-info-section {
                padding: var(--spacing-md);
            }
        }
    </style>
</head>
<body>
    <!-- Navigation Placeholder -->
    <div id="nav-placeholder"></div>

    <!-- Main Content -->
    <main>
        <section class="hero-section">
            <div class="hero-content">
                <h1>联系我们</h1>
                <p class="hero-subtitle">让我们携手打造您的理想户外空间</p>
            </div>
        </section>

        <section class="section">
            <div class="container">
                <div class="contact-wrapper">
                    <!-- Contact Form -->
                    <div class="contact-form-section">
                        <h2>发送留言</h2>
                        <form id="contactForm" action="https://api.web3forms.com/submit" method="POST">
                            <!-- Web3Forms Access Key -->
                            <input type="hidden" name="access_key" value="718c5272-0441-4fd6-81ed-b879d37d84e1">
                            
                            <!-- Redirect to thank you page after successful submission -->
                            <input type="hidden" name="redirect" value="thank-you-zh">
                            
                            <!-- Custom subject line -->
                            <input type="hidden" name="subject" value="新咨询表单 - JR Hardscaping 中文网站">
                            
                            <!-- From name for better email organization -->
                            <input type="hidden" name="from_name" value="JR Hardscaping 中文网站">
                            
                            <div class="form-group">
                                <label for="name">姓名 *</label>
                                <input type="text" id="name" name="name" required>
                            </div>
                            <div class="form-group">
                                <label for="email">电子邮箱 *</label>
                                <input type="email" id="email" name="email" required>
                            </div>
                            <div class="form-group">
                                <label for="phone">电话号码</label>
                                <input type="tel" id="phone" name="phone">
                            </div>
                            <div class="form-group">
                                <label for="service">感兴趣的服务</label>
                                <select id="service" name="service">
                                    <option value="">请选择服务类型</option>
                                    <option value="consultation">免费咨询</option>
                                    <option value="patio">露台与步道</option>
                                    <option value="driveway">车道工程</option>
                                    <option value="retaining-wall">挡土墙</option>
                                    <option value="fire-pit">火炉与户外厨房</option>
                                    <option value="other">其他</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="message">留言内容 *</label>
                                <textarea id="message" name="message" required placeholder="请简要描述您的项目需求，包括大致面积、预算范围和期望的施工时间..."></textarea>
                            </div>
                            
                            <!-- Honeypot for spam protection -->
                            <input type="checkbox" name="botcheck" class="hidden" style="display: none;">
                            
                            <button type="submit" class="submit-btn">提交留言</button>
                        </form>
                    </div>

                    <!-- Contact Information -->
                    <div class="contact-info-section">
                        <h2>联系方式</h2>
                        
                        <div class="contact-info-item">
                            <h3>📍 公司地址</h3>
                            <p>
                                Unit 2 - 1300 Alness Street<br>
                                Toronto, ON L4K 2W6<br>
                                加拿大
                            </p>
                        </div>

                        <div class="contact-info-item">
                            <h3>📞 电话</h3>
                            <p>
                                <a href="tel:+16479954576">+1 (647) 995-4576</a>
                            </p>
                        </div>

                        <div class="contact-info-item">
                            <h3>✉️ 邮箱</h3>
                            <p>
                                <a href="#" data-email-user="Frankie.Li" data-email-domain="JrPartners.ca">联系 Frankie Li</a><br>
                                <a href="#" data-email-user="info" data-email-domain="JrPartners.ca">一般咨询</a>
                            </p>
                        </div>

                        <div class="contact-info-item">
                            <h3>🕒 营业时间</h3>
                            <p>
                                周一至周五：上午 8:00 - 下午 6:00<br>
                                周六：上午 9:00 - 下午 4:00<br>
                                周日：休息
                            </p>
                        </div>

                        <div class="contact-info-item">
                            <h3>🏙️ 服务区域</h3>
                            <p>
                                多伦多、旺市、密西沙加、列治文山、万锦及大多伦多其他地区
                            </p>
                        </div>

                        <div class="contact-info-item">
                            <h3>💬 语言服务</h3>
                            <p>
                                我们提供中英文双语服务，沟通无障碍
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <div id="footer-placeholder"></div>

    <!-- Load Navigation and Footer Components -->
    <script src="load-components.js"></script>
</body>
</html>
